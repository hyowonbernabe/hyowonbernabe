name: contribution grid

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/grid-dark.svg?color_snake=#ff0f0f&color_dots=#161b22,#4a0a0a,#8a0c0c,#c70e0e,#ff0f0f
            dist/grid-light.svg?color_snake=#ff0f0f&color_dots=#ebedf0,#ffb3b3,#ff6b6b,#ff2e2e,#c70000

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
