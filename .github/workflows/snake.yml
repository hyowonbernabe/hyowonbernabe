name: contribution grid

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/grid.svg?color_snake=#ff0f0f&color_dots=#161616,#4a0000,#8a0c0c,#c70e0e,#ff0f0f

      # drop the "eaten" progress bar, trim the space it leaves, and put the grid on the site's ink background
      - run: sed -i -E 's#<rect class="u [^>]*/>##g; s#viewBox="(-?[0-9.]+) -32 ([0-9.]+) 192"#viewBox="\1 -16 \2 134"#; s#height="192"#height="134"#; s#</desc>#</desc><rect x="-16" y="-16" width="100%" height="100%" rx="14" fill="\#050505"/>#' dist/*.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
