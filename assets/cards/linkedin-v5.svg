<svg xmlns="http://www.w3.org/2000/svg" width="440" height="104" viewBox="0 0 440 104" role="img" aria-label="LINKEDIN"><style>@font-face{font-family:D;src:url(data:font/woff2;base64,) format('woff2')}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.grain{animation:j 1.2s steps(8) infinite}@keyframes j{50%{transform:translate(-3px,2px)}}</style><defs><pattern id="g" width="45" height="45" patternUnits="userSpaceOnUse"><path d="M45 0H0V45" fill="none" stroke="#ededed" stroke-opacity="0.05"/></pattern><radialGradient id="glow"><stop offset="0" stop-color="#ff0f0f" stop-opacity=".35"/><stop offset="1" stop-color="#ff0f0f" stop-opacity="0"/></radialGradient><radialGradient id="edge" r="80%"><stop offset=".5" stop-color="#4a0000" stop-opacity="0"/><stop offset="1" stop-color="#4a0000" stop-opacity=".55"/></radialGradient><filter id="bloom" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5"/></filter><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><clipPath id="c"><rect width="440" height="104" rx="14"/></clipPath></defs><g clip-path="url(#c)"><rect width="440" height="104" fill="#050505"/><rect width="440" height="104" fill="url(#g)"/><circle cx="202" cy="91" r="0.8" fill="#ededed" opacity="0.21"/><circle cx="292" cy="66" r="0.8" fill="#ededed" opacity="0.17"/><rect width="440" height="4" fill="#ff0f0f"/><text x="36.0" y="66.0" text-anchor="start" fill="#ededed" style="font-family:D,serif;font-size:34px;letter-spacing:-0.02em" >LINKEDIN</text><path d="M374 66L400 40M381.8 40H400V58.2" stroke="#ff0f0f" stroke-width="3" fill="none" stroke-linecap="square"/><rect x="-10" y="-10" width="460" height="124" filter="url(#noise)" opacity=".07" class="grain"/></g></svg>